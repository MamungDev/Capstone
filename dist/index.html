<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mamungkun creative brief</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
:root{--ink:#1d2b4d;--muted:#71809c;--paper:#f7f8fc;--line:#dce3ef;--blue:#3158c9;--sky:#e6efff;--yellow:#ffd166;--coral:#f17d67;--mint:#d8f2e7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,Arial,sans-serif}.shell{max-width:1320px;margin:auto;padding:20px 5vw 48px}button,input,textarea,select{font:inherit}button{cursor:pointer}nav{height:58px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:22px;letter-spacing:-.05em}.mark{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--ink);color:var(--yellow);transform:rotate(-5deg)}.nav{display:flex;gap:16px;align-items:center;color:var(--muted);font-size:14px;font-weight:700}.plain{border:0;background:none;color:inherit;font-weight:800}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f8bf7a,#ee786b);display:grid;place-items:center;color:#fff;font-size:12px}.progress{display:flex;align-items:center;margin:38px auto 30px;width:min(620px,100%)}.line{height:1px;background:#ccd5e4;flex:1}.step{width:28px;height:28px;display:grid;place-items:center;flex:none;border-radius:50%;border:1px solid #c5cfdf;background:#fff;color:#90a0ba;font:500 12px 'DM Mono'}.step.active{color:#fff;background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 5px #e2e9ff}.step.done{border-color:var(--ink);color:var(--ink)}.labels{display:flex;justify-content:space-between;width:min(690px,110%);margin:-21px auto 45px;font-size:11px;color:#8a99b3;font-weight:700}.labels .current{color:var(--blue)}main{max-width:1040px;margin:auto}.eyebrow{font:500 12px 'DM Mono';text-transform:uppercase;letter-spacing:.12em;color:var(--coral)}h1{margin:12px 0;font-family:'Playfair Display',Georgia,serif;font-size:clamp(38px,5vw,64px);line-height:1.04;letter-spacing:-.055em}h1 em{color:var(--blue)}.intro{max-width:590px;margin:0 0 34px;color:var(--muted);line-height:1.65;font-size:16px}.grid,.review{display:grid;grid-template-columns:1.16fr .84fr;gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 38px rgba(27,47,86,.06);padding:25px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.row{margin-bottom:12px}label,h2{font-size:14px;font-weight:800}.hint,.subtle{font-size:12px;color:#98a4b9}textarea{width:100%;height:138px;resize:vertical;border:1px solid #cbd6e6;border-radius:12px;padding:15px;line-height:1.6;color:var(--ink);outline:0}textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px #e6edff}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.chip{border:1px solid #dbe3ef;border-radius:30px;background:#fff;padding:8px 11px;font-size:12px;color:#66758d;font-weight:700}.chip.on,.chip:hover{background:var(--sky);border-color:#b3c8ff;color:var(--blue)}.settings{position:relative;overflow:hidden}.settings:after{content:'';position:absolute;right:-52px;top:-61px;width:140px;height:140px;border-radius:50%;background:var(--mint)}h2{position:relative;z-index:1;margin:0 0 20px;font-size:16px}.option{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid #edf0f5}.option:first-of-type{border:0}.option span{font-size:13px;color:var(--muted)}select{border:0;background:transparent;color:var(--ink);font-size:13px;font-weight:800;outline:0;text-align:right}.sources{margin-top:20px}.sources .row{align-items:end;margin-bottom:18px}.sources h2{font-size:19px;letter-spacing:-.03em}.sources p{margin:4px 0 0;color:var(--muted);font-size:13px}.sourcegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.source{min-height:170px;border:1.5px dashed #b8c6da;border-radius:14px;padding:19px;display:flex;flex-direction:column;justify-content:space-between;transition:.2s}.source:hover,.source:focus-within{transform:translateY(-3px);border-color:var(--blue);background:#fbfcff}.icon{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:var(--sky);color:var(--blue);font-size:20px}.source:nth-child(2) .icon{background:#fff3d5;color:#ba7615}.source h3{font-size:15px;margin:14px 0 5px}.source p{font-size:12px;line-height:1.5;color:var(--muted);margin:0}.source button{align-self:flex-start;border:0;background:none;padding:0;color:var(--blue);font-weight:800;font-size:12px}.file{max-width:100%;margin-top:14px;padding:8px 10px;border-radius:8px;background:#eef3ff;color:var(--blue);font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.footer{display:flex;align-items:center;justify-content:space-between;margin-top:30px;padding:0 4px}.back{border:0;background:none;color:#6f7f99;font-size:14px;font-weight:800}.continue{border:0;border-radius:11px;background:var(--ink);color:#fff;padding:14px 19px;font-size:14px;font-weight:800;box-shadow:0 8px 16px rgba(29,43,77,.17)}.continue:hover{background:var(--blue);transform:translateY(-1px)}.summary{border-top:1px solid #edf0f5;padding:17px 0}.summary:first-child{border-top:0;padding-top:0}.summary strong{display:block;font-size:12px;color:#8997ae;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}.preview{min-height:250px;border-radius:14px;background:#f0f3f9;display:grid;place-items:center;overflow:hidden;color:#8191aa;text-align:center;font-size:13px;line-height:1.7}.preview img{width:100%;height:250px;object-fit:cover}dialog{border:0;border-radius:18px;padding:0;max-width:min(680px,94vw);width:680px;box-shadow:0 30px 90px rgba(12,24,54,.35)}dialog::backdrop{background:rgba(20,31,55,.45);backdrop-filter:blur(3px)}.modal{padding:24px}.modalhead{display:flex;justify-content:space-between;align-items:start;margin-bottom:17px}.modalhead h2{font-size:22px}.x{width:34px;height:34px;border:0;border-radius:9px;background:#eef2f8;color:var(--ink);font-size:20px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.color{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccd4e1}.color.active{box-shadow:0 0 0 2px var(--ink)}.small{border:1px solid #d5deea;background:#fff;border-radius:8px;padding:7px 10px;font-size:12px;color:var(--ink);font-weight:800}.canvaswrap{border:1px solid #d7dfeb;border-radius:13px;overflow:hidden;background:#fff}.canvaswrap canvas{display:block;width:100%;height:310px;touch-action:none}.modalactions{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.success{text-align:center;max-width:600px;margin:35px auto}.successmark{margin:0 auto 24px;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:#1d8868;font-size:30px}.success h1{font-size:48px}.success p{color:var(--muted);line-height:1.65}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;border-radius:11px;padding:12px 16px;font-size:13px;font-weight:700;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:720px){.nav span{display:none}.grid,.review,.sourcegrid{grid-template-columns:1fr}.settings{order:-1}.progress{margin-top:25px}.labels{width:100%;font-size:9px}h1{font-size:44px}.card{padding:20px}.note{display:none}.canvaswrap canvas{height:250px}}
</style>
</head>
<body><div class="shell"><nav><div class="brand"><span class="mark">✦</span>makerflow</div><div class="nav"><button class="plain" id="reset">Start over</button><span id="saved">Saved</span><div class="avatar">AK</div></div></nav><div class="progress" id="progress"></div><div class="labels"><span>Describe</span><span>Set direction</span><span>Add references</span><span>Review</span></div><main id="app"></main></div>
<dialog id="dialog"><div class="modal"><div class="modalhead"><div><h2>Sketch the feeling</h2><p class="subtle">Keep it loose—shapes, lines, and colour cues are enough.</p></div><button class="x" id="close" aria-label="Close sketchpad">×</button></div><div class="tools"><button class="color active" data-color="#1d2b4d" style="background:#1d2b4d"></button><button class="color" data-color="#3158c9" style="background:#3158c9"></button><button class="color" data-color="#f17d67" style="background:#f17d67"></button><button class="color" data-color="#e5a72d" style="background:#e5a72d"></button><label class="subtle">Size <input id="size" type="range" min="2" max="18" value="5"></label><button class="small" id="clear">Clear</button></div><div class="canvaswrap"><canvas id="canvas"></canvas></div><div class="modalactions"><span class="subtle">Your sketch stays on this device.</span><button class="continue" id="use">Use this sketch</button></div></div></dialog><div class="toast" id="toast" role="status"></div>
<script>
const KEY='makerflow-brief-v1',defaults={idea:'A poster series for a small, late-night jazz room. Warm, hand-printed, a little unexpected.',tags:['Warm'],format:'Poster · 4:5',style:'Hand-crafted',energy:'Warm & rich',reference:null,referenceName:'',sketch:null,step:3};let state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')};const app=document.querySelector('#app'),toast=document.querySelector('#toast');const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));document.querySelector('#saved').textContent='Saved'};const say=m=>{toast.textContent=m;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2400)};const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function progress(){const n=state.step===4?4:3;document.querySelector('#progress').innerHTML=[1,2,3,4].map((x,i)=>`${i?'<span class="line"></span>':''}<span class="step ${x<n?'done':''} ${x===n?'active':''}">${x<n?'✓':x}</span>`).join('');document.querySelectorAll('.labels span').forEach((e,i)=>e.classList.toggle('current',i+1===n))}
function edit(){const c=t=>`<button class="chip ${state.tags.includes(t)?'on':''}" data-tag="${t}">${t}</button>`;app.innerHTML=`<div class="eyebrow">Step 03 — visual reference</div><h1>Give your idea <em>a point of view.</em></h1><p class="intro">A few words and a visual reference are enough to make the next draft feel unmistakably yours.</p><section class="grid"><div class="card"><div class="row"><label for="idea">What are you making?</label><span class="hint">Be specific, not long</span></div><textarea id="idea" placeholder="Describe what you want to make"></textarea><div class="chips">${['Warm','Playful','Editorial','Minimal','Surprising'].map(c).join('')}</div></div><aside class="card settings"><h2>Creative direction</h2><div class="option"><span>Format</span><select id="format"><option>Poster · 4:5</option><option>Square · 1:1</option><option>Wide · 16:9</option></select></div><div class="option"><span>Style</span><select id="style"><option>Hand-crafted</option><option>Clean & modern</option><option>Expressive</option></select></div><div class="option"><span>Color energy</span><select id="energy"><option>Warm & rich</option><option>Quiet & soft</option><option>High contrast</option></select></div></aside></section><section class="card sources"><div class="row"><div><h2>Add a visual starting point</h2><p>Use an image you love—or sketch the feeling in seconds.</p></div><span class="hint">Optional</span></div><div class="sourcegrid"><div class="source"><div><div class="icon">↥</div><h3>Upload an image</h3><p>Photo, moodboard, texture, or an existing design.</p></div><label><input id="file" type="file" accept="image/*" hidden><button type="button" id="upload">Choose a file</button></label>${state.reference?`<div class="file">✓ ${safe(state.referenceName)}</div>`:''}</div><div class="source"><div><div class="icon">✎</div><h3>Draw a quick sketch</h3><p>Rough shapes are perfect. You can refine it later.</p></div><button type="button" id="draw">${state.sketch?'Edit sketch':'Open sketchpad'}</button>${state.sketch?'<div class="file">✓ Sketch added</div>':''}</div></div></section><div class="footer"><button class="back" id="back">← Back to direction</button><span class="hint note">Changes save automatically</span><button class="continue" id="next">Continue to review</button></div>`;document.querySelector('#idea').value=state.idea;['format','style','energy'].forEach(k=>document.querySelector('#'+k).value=state[k]);document.querySelector('#idea').oninput=e=>{state.idea=e.target.value;save()};['format','style','energy'].forEach(k=>document.querySelector('#'+k).onchange=e=>{state[k]=e.target.value;save()});document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{state.tags=state.tags.includes(b.dataset.tag)?state.tags.filter(x=>x!==b.dataset.tag):[...state.tags,b.dataset.tag];save();render()});document.querySelector('#upload').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=file;document.querySelector('#draw').onclick=open;document.querySelector('#next').onclick=()=>{if(!state.idea.trim()){say('Tell us what you’re making first.');document.querySelector('#idea').focus();return}state.step=4;save();render()};document.querySelector('#back').onclick=()=>say('Your earlier direction is saved here.')}
function file(e){const f=e.target.files[0];if(!f||!f.type.startsWith('image/'))return say('Choose an image file.');const r=new FileReader;r.onload=()=>{state.reference=r.result;state.referenceName=f.name;state.sketch=null;save();render();say('Reference added. Nice choice.')};r.readAsDataURL(f)}
function review(){const im=state.reference||state.sketch;app.innerHTML=`<div class="eyebrow">Step 04 — review your brief</div><h1>It’s taking <em>shape.</em></h1><p class="intro">Check the essentials, then send this brief on its way.</p><section class="review"><div class="card"><div class="summary"><strong>Your idea</strong><div>${safe(state.idea)}</div></div><div class="summary"><strong>Direction</strong><div>${safe(state.style)} · ${safe(state.energy)} · ${safe(state.format)}</div></div><div class="summary"><strong>Keywords</strong><div>${state.tags.length?state.tags.map(t=>`<span class="chip on" style="display:inline-block;margin:0 5px 5px 0">${t}</span>`).join(''):'No keywords selected'}</div></div></div><div class="card"><div class="preview">${im?`<img src="${im}" alt="Your visual reference">`:'<div>No visual reference yet<br><span class="subtle">Your written direction will lead.</span></div>'}</div><div class="summary" style="padding-bottom:0"><strong>Visual reference</strong><div>${im?(state.referenceName||'Your sketch'):'None added'}</div></div></div></section><div class="footer"><button class="back" id="edit">← Edit brief</button><span class="hint note">Ready when you are</span><button class="continue" id="submit">Submit brief</button></div>`;document.querySelector('#edit').onclick=()=>{state.step=3;save();render()};document.querySelector('#submit').onclick=()=>{state.submitted=true;save();render()}}
function success(){app.innerHTML=`<section class="success"><div class="successmark">✓</div><div class="eyebrow">Brief submitted</div><h1>Your idea is <em>on its way.</em></h1><p>We saved your creative direction${state.reference||state.sketch?' and visual reference':''}. You can start a new brief whenever inspiration strikes.</p><button class="continue" id="new">Create another brief</button></section>`;document.querySelector('#new').onclick=()=>{state={...defaults};save();render()}}
function render(){progress();state.submitted?success():state.step===4?review():edit()}document.querySelector('#reset').onclick=()=>{if(confirm('Start a new brief? Your current brief will be cleared from this device.')){state={...defaults};save();render();say('Fresh canvas, ready when you are.')}};
const dialog=document.querySelector('#dialog'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');let drawing=false,last,color='#1d2b4d';function fit(){const r=canvas.getBoundingClientRect(),old=state.sketch;canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);if(old){let i=new Image;i.onload=()=>ctx.drawImage(i,0,0,r.width,r.height);i.src=old}}function open(){dialog.showModal();requestAnimationFrame(fit)}function point(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.onpointerdown=e=>{drawing=true;last=point(e)};canvas.onpointermove=e=>{if(!drawing)return;e.preventDefault();let p=point(e);ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=document.querySelector('#size').value;ctx.lineCap='round';ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};window.onpointerup=()=>drawing=false;document.querySelectorAll('.color').forEach(b=>b.onclick=()=>{color=b.dataset.color;document.querySelectorAll('.color').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelector('#clear').onclick=()=>{state.sketch=null;fit()};document.querySelector('#close').onclick=()=>dialog.close();document.querySelector('#use').onclick=()=>{state.sketch=canvas.toDataURL('image/png');state.reference=null;state.referenceName='';save();dialog.close();render();say('Sketch added to your brief.')};render();
</script><script src="app.js"></script><script src="auth-config.js"></script><script src="auth.js"></script><script src="landing.js"></script></body></html>
