[package]
name = "mamungkun"
version = "0.1.0"
description = "Mamungkun creative brief desktop app"
authors = ["MamungDev"]
edition = "2021"

[lib]
name = "mamungkun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"
url = "2"
