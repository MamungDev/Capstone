<!doctype html>
<meta charset="utf-8">
<title>Sketchpad browser regression tests</title>
<style>body{font:14px monospace}iframe{border:0;width:1100px;height:1000px}pre{white-space:pre-wrap}</style>
<pre id="results">RUNNING</pre>
<iframe title="Isolated client sketchpad test"></iframe>
<script>
// Open this page in a browser. Uses an isolated draft ID and never submits a brief.
const frame = document.querySelector('iframe');
document.querySelector('#results').textContent = 'STARTED';
frame.srcdoc = `<!doctype html><html><head><link rel="stylesheet" href="../Client/client.css">
<script>window.CLIENT_SESSION = {id:'sketchpad-regression-test',csrf:'test'};<\/script>
<script src="../Client/draft-store.js" defer><\/script><script src="../Client/sketchpad.js" defer><\/script><script src="../Client/client.js" defer><\/script></head>
<body><div id="saved"></div><div class="labels"><span></span><span></span><span></span><span></span></div><div id="progress"></div><main id="app"></main><div id="toast"></div><button id="reset">Reset</button><button id="logout">Logout</button></body></html>`;
frame.onload = async () => {
  const results = document.querySelector('#results'), passed = [];
  const win = frame.contentWindow, doc = win.document, $ = s => doc.querySelector(s);
  const assert = (ok, label) => { if (!ok) throw new Error(label); passed.push(label); results.textContent = `RUNNING: ${passed.length} checks\n` + passed.join('\n'); };
  const tick = () => new Promise(resolve => setTimeout(resolve, 60));
  try {
    for (let i = 0; i < 100 && !$('[data-go="3"]'); i++) await tick();
    $('[data-go="3"]').click(); $('#draw').click(); await tick();
    const canvas = $('#sketchCanvas'), ctx = canvas.getContext('2d');
    const pixel = (x, y) => Array.from(ctx.getImageData(x, y, 1, 1).data).join(',');
    const snapshot = () => canvas.toDataURL();
    const white = '255,255,255,255';
    // Synthetic pointer events do not establish browser pointer capture.
    canvas.setPointerCapture = () => {}; canvas.hasPointerCapture = () => false;
    const point = (type, x, y, extra = {}) => {
      const r = canvas.getBoundingClientRect();
      canvas.dispatchEvent(new win.PointerEvent(type, {bubbles:true, pointerId:1, button:0, clientX:r.left + x * r.width / 1200, clientY:r.top + y * r.height / 720, ...extra}));
    };
    const draw = (tool, x1, y1, x2, y2, extra) => {
      $(`[data-tool="${tool}"]`).click(); point('pointerdown', x1, y1, extra); point('pointermove', x2, y2, extra); point('pointerup', x2, y2, extra);
    };
    const blank = snapshot();
    assert($('#sketchUndo').disabled, 'Undo disabled on a fresh canvas');
    assert(canvas.width === 1200 && canvas.height === 720, 'Fixed 1200 × 720 resolution');
    assert(canvas.getBoundingClientRect().height <= $('#sketchViewport').clientHeight, 'Fit shows the entire canvas');
    draw('pencil', 100, 100, 300, 100);
    assert(pixel(200, 100) === '29,43,77,255', 'Pencil draws at the intended canvas coordinates');
    const stroke = snapshot();
    $('#sketchUndo').click(); assert(snapshot() === blank, 'Undo restores exact previous pixels');
    $('#sketchRedo').click(); assert(snapshot() === stroke, 'Redo restores exact drawing');
    const key = (key, extra = {}, target = canvas) => target.dispatchEvent(new win.KeyboardEvent('keydown', {key, bubbles:true, cancelable:true, ...extra}));
    key('g');
    assert(!$('[data-tool="pan"]') && $('[data-tool="move"]').getAttribute('aria-pressed') === 'true' && $('[data-tool="move"]').title.includes('G'), 'G selects Move and replaces the Pan tool');
    point('pointerdown', 200, 100); point('pointermove', 260, 160); point('pointerup', 260, 160);
    assert(pixel(200, 100) === white && pixel(260, 160) === '29,43,77,255' && !$('.sketch-selection').hidden, 'Move relocates an individual stroke and displays its selection');
    const movedStroke = snapshot();
    $('#sketchUndo').click(); assert(snapshot() === stroke, 'Undo restores a moved drawing element');
    $('#sketchRedo').click(); assert(snapshot() === movedStroke, 'Redo restores a moved drawing element');
    point('pointerdown', 260, 160); point('pointermove', 300, 200); point('pointercancel', 300, 200);
    assert(snapshot() === movedStroke, 'Cancelled Move restores the complete original stroke');
    $('#sketchSnap').checked = true;
    point('pointerdown', 260, 160); point('pointerup', 260, 160);
    assert(snapshot() === movedStroke, 'Selecting without dragging does not move or snap an element');
    $('#sketchSnap').checked = false;
    key('ArrowDown', {shiftKey:true});
    assert(pixel(260, 170) === '29,43,77,255' && pixel(260, 160) === white, 'Shift and arrow keys nudge a selected element by 10 pixels');
    $('#sketchUndo').click(); $('#sketchUndo').click();
    point('pointerdown', 1000, 600); point('pointermove', 1100, 650); point('pointerup', 1100, 650);
    assert(snapshot() === stroke && $('.sketch-selection').hidden, 'Dragging empty space leaves the sketch unchanged');
    draw('eraser', 200, 80, 200, 120); assert(pixel(200, 100) === white, 'Eraser removes drawn pixels');
    $('#sketchUndo').click();
    draw('marker', 100, 200, 300, 200);
    const marker = ctx.getImageData(200, 200, 1, 1).data;
    assert(marker[0] > 150 && marker[0] < 230, 'Marker has translucent coverage');
    $('#sketchFill').checked = true;
    $('[data-colour="#3158c9"]').click();
    draw('rectangle', 400, 100, 600, 250);
    assert(pixel(500, 180) === '49,88,201,255', 'Filled rectangle uses the selected color');
    draw('ellipse', 650, 100, 850, 250);
    assert(pixel(750, 175) === '49,88,201,255' && pixel(651, 101) === white, 'Ellipse fills its interior only');
    const beforeShapeMove = snapshot();
    $('#zoomIn').click();
    draw('move', 750, 175, 850, 375, {pointerType:'touch'});
    assert(pixel(750, 175) === white && pixel(850, 375) === '49,88,201,255' && pixel(500, 180) === '49,88,201,255', 'Touch Move relocates an ellipse precisely while zoomed and preserves other shapes');
    $('#sketchUndo').click(); $('#zoomFit').click();
    assert(snapshot() === beforeShapeMove, 'Undo restores moved shapes exactly');
    key('v');
    assert($('[data-tool="select"]').getAttribute('aria-pressed') === 'true' && $('[data-tool="select"]').title.includes('V'), 'V activates the Select tool');
    point('pointerdown', 380, 80); point('pointermove', 870, 270);
    assert($('.sketch-selection').classList.contains('is-marquee'), 'Dragging empty canvas displays a selection box');
    point('pointerup', 870, 270);
    assert($('.sketch-selection').dataset.count === '2' && snapshot() === beforeShapeMove, 'Selection box selects enclosed shapes without modifying artwork');
    point('pointerdown', 500, 180, {shiftKey:true}); point('pointerup', 500, 180, {shiftKey:true});
    assert($('.sketch-selection').dataset.count === '1', 'Shift-click removes an element from selection');
    point('pointerdown', 500, 180, {shiftKey:true}); point('pointerup', 500, 180, {shiftKey:true});
    assert($('.sketch-selection').dataset.count === '2', 'Shift-click adds an element to selection');
    key('g');
    point('pointerdown', 500, 180); point('pointermove', 500, 380); point('pointerup', 500, 380);
    assert(pixel(500, 180) === white && pixel(750, 175) === white && pixel(500, 380) === '49,88,201,255' && pixel(750, 375) === '49,88,201,255', 'Move preserves a multi-selection and moves both shapes together');
    const movedGroup = snapshot();
    $('#sketchUndo').click(); assert(snapshot() === beforeShapeMove, 'A group move is undone in one step');
    $('#sketchRedo').click(); assert(snapshot() === movedGroup, 'Redo restores the entire group move');
    $('#sketchUndo').click(); key('v');
    point('pointerdown', 870, 270); point('pointermove', 380, 80); point('pointerup', 380, 80);
    assert($('.sketch-selection').dataset.count === '2', 'Selection works when dragging from bottom-right to top-left');
    point('pointerdown', 500, 180); point('pointermove', 500, 380); point('pointercancel', 500, 380);
    assert(snapshot() === beforeShapeMove && $('.sketch-selection').dataset.count === '2', 'Cancelling a selected group drag restores every element');
    key('ArrowDown', {shiftKey:true});
    assert(pixel(500, 105) === white && pixel(750, 105) === white, 'Keyboard nudging moves every selected shape');
    $('#sketchUndo').click();
    point('pointerdown', 500, 180); point('pointerup', 500, 180);
    point('pointerdown', 950, 500); point('pointermove', 1000, 600); point('pointercancel', 1000, 600);
    assert($('.sketch-selection').dataset.count === '1' && snapshot() === beforeShapeMove, 'Cancelling a selection box restores the previous selection');
    key('Escape');
    assert($('.sketch-selection').hidden && $('.sketch-dialog').open, 'Escape clears selection while keeping the sketchpad open');
    $('[data-colour="#f17d67"]').click(); draw('rectangle', 450, 150, 550, 220);
    draw('move', 500, 180, 700, 500);
    assert(pixel(500, 180) === '49,88,201,255' && pixel(700, 500) === '241,125,103,255', 'Move selects the top overlapping shape and reveals intact artwork beneath');
    $('#sketchUndo').click(); $('#sketchUndo').click(); $('[data-colour="#3158c9"]').click();
    $('#sketchFill').checked = false;
    draw('line', 100, 300, 300, 300); assert(pixel(200, 300) === '49,88,201,255', 'Line draws a straight stroke');
    draw('arrow', 400, 300, 600, 300); assert(pixel(590, 305) !== white, 'Arrow includes its arrowhead');
    draw('move', 500, 300, 550, 350);
    assert(pixel(500, 300) === white && pixel(640, 355) !== white, 'Moving an arrow carries its line and arrowhead together');
    $('#sketchUndo').click();
    $('#sketchSnap').checked = true; $('#sketchSnap').dispatchEvent(new win.Event('change'));
    draw('rectangle', 410, 410, 510, 460, {shiftKey:true});
    assert(pixel(456, 504) !== white, 'Grid snapping and Shift create a precise square');
    $('#sketchSnap').checked = false;
    $('[data-tool="picker"]').click(); point('pointerdown', 500, 180);
    assert($('#sketchColor').value === '#3158c9', 'Eyedropper samples the canvas color');
    $('[data-tool="text"]').click();
    const beforeText = snapshot(); point('pointerdown', 650, 350);
    const editText = value => {
      const input = $('.sketch-text-input'); input.focus(); input.value = value;
      input.dispatchEvent(new win.Event('input', {bubbles:true})); input.blur();
    };
    editText('Logo goes here\nSecond line');
    assert($('.sketch-text-input').value === 'Logo goes here\nSecond line', 'Text boxes support direct multiline editing');
    assert(snapshot() === beforeText, 'Text stays editable without changing artwork underneath');
    const textPosition = () => [$('.sketch-text-box').style.left, $('.sketch-text-box').style.top].join(',');
    const originalPosition = textPosition();
    key('v', {}, $('.sketch-text-input'));
    assert($('[data-tool="text"]').getAttribute('aria-pressed') === 'true', 'Typing V in a text box does not activate Select');
    draw('select', 380, 80, 1010, 445);
    assert($('.sketch-selection').dataset.count === '4', 'Selection box includes text along with shapes and arrows');
    point('pointerdown', 700, 380); point('pointermove', 720, 400); point('pointerup', 720, 400);
    assert(Math.abs(parseFloat($('.sketch-text-box').style.left) - 670 / 1200 * 100) < .01 && pixel(500, 320) === '49,88,201,255', 'Dragging selected text also moves the other selected elements');
    $('#sketchUndo').click();
    assert(textPosition() === originalPosition && snapshot() === beforeText, 'Undo restores both artwork and text in a mixed selection');
    $('[data-tool="text"]').click();
    key('g', {}, $('.sketch-text-input'));
    assert($('[data-tool="text"]').getAttribute('aria-pressed') === 'true', 'Typing G inside a text box does not switch tools');
    draw('move', 700, 380, 760, 420);
    assert(textPosition() !== originalPosition && snapshot() === beforeText && win.getComputedStyle($('.sketch-text-input')).pointerEvents === 'none', 'Move drags a text box from its body without altering underlying artwork');
    $('#sketchUndo').click();
    assert(textPosition() === originalPosition, 'Undo restores text moved with the Move tool');
    $('[data-tool="text"]').click(); $('.sketch-text-input').focus();
    const dragText = (dx, dy, cancel = false, pointerType = 'mouse') => {
      const handle = $('.sketch-text-move'); handle.setPointerCapture = () => {}; handle.hasPointerCapture = () => false;
      const rect = handle.getBoundingClientRect(), scale = canvas.getBoundingClientRect().width / 1200;
      const send = (type, x, y) => handle.dispatchEvent(new win.PointerEvent(type, {bubbles:true, button:0, pointerId:2, pointerType, clientX:x, clientY:y}));
      send('pointerdown', rect.left + 5, rect.top + 5);
      send('pointermove', rect.left + 5 + dx * scale, rect.top + 5 + dy * scale);
      send(cancel ? 'pointercancel' : 'pointerup', rect.left + 5 + dx * scale, rect.top + 5 + dy * scale);
    };
    dragText(120, 80);
    assert(textPosition() !== originalPosition && snapshot() === beforeText, 'Dragging a text box moves it without damaging the drawing');
    const movedPosition = textPosition();
    $('#sketchUndo').click(); assert(textPosition() === originalPosition, 'Undo restores a text box position');
    $('#sketchRedo').click(); assert(textPosition() === movedPosition, 'Redo restores a text box move');
    dragText(-60, 20, true, 'touch'); assert(textPosition() === movedPosition, 'Cancelled touch dragging restores the text position');
    $('#zoomIn').click(); dragText(-120, -80, false, 'touch');
    const movedBack = parseFloat($('.sketch-text-box').style.left);
    assert(Math.abs(movedBack - 650 / 1200 * 100) < .01, 'Touch dragging uses correct coordinates while zoomed');
    $('#zoomFit').click();
    $('.sketch-text-move').dispatchEvent(new win.KeyboardEvent('keydown', {key:'ArrowRight', shiftKey:true, bubbles:true}));
    assert(Math.abs(parseFloat($('.sketch-text-box').style.left) - 660 / 1200 * 100) < .01, 'Move handle supports precise keyboard positioning');
    $('[aria-label="Delete text box"]').click(); assert(!$('.sketch-text-input'), 'Selected text boxes can be deleted');
    $('#sketchUndo').click(); assert($('.sketch-text-input').value.includes('Second line'), 'Undo restores a deleted text box and its contents');
    $('.sketch-text-input').focus(); $('#sketchFont').value = '36'; $('#sketchFont').dispatchEvent(new win.Event('change'));
    assert(parseFloat($('.sketch-text-input').style.fontSize) > 10, 'Selected text size can be changed');
    const transfer = new win.DataTransfer(); transfer.setData('application/x-sketch-text', 'new');
    const canvasRect = canvas.getBoundingClientRect();
    $('#sketchViewport').dispatchEvent(new win.DragEvent('drop', {bubbles:true, dataTransfer:transfer, clientX:canvasRect.left + 40, clientY:canvasRect.top + 40}));
    assert(doc.querySelectorAll('.sketch-text-input').length === 2, 'Dropping the text tool creates another editable text box');
    doc.querySelectorAll('[aria-label="Delete text box"]')[1].click();
    const beforeCancel = snapshot();
    $('[data-tool="pencil"]').click(); point('pointerdown', 10, 500); point('pointermove', 500, 500); point('pointercancel', 500, 500);
    assert(snapshot() === beforeCancel, 'Cancelled gestures leave no partial stroke');
    $('#clearSketch').click(); assert(snapshot() === blank, 'Clear removes the entire sketch');
    assert(!$('.sketch-text-input'), 'Clear also removes text boxes');
    $('#sketchUndo').click(); assert(snapshot() === beforeCancel, 'Clear can be undone');
    assert($('.sketch-text-input').value.includes('Second line'), 'Undo clear restores editable text boxes');
    $('#zoomIn').click(); $('#zoomIn').click();
    assert(snapshot() === beforeCancel && $('#zoomValue').value === '150%', 'Zoom preserves image pixels');
    draw('pencil', 100, 600, 300, 600);
    assert(pixel(200, 600) === '49,88,201,255', 'Drawing coordinates remain correct while zoomed');
    const finalDrawing = snapshot();
    $('#saveSketch').click();
    await tick();
    const savedDraft = await win.clientDraftStore.load('capstone-client-brief-v1:sketchpad-regression-test');
    const savedReference = savedDraft.references[0];
    assert(savedReference.sketchDocument.version === 2 && savedReference.sketchDocument.elements.some(element => element.tool === 'arrow'), 'Drafts retain individual drawing elements for future moves');
    const finalSketch = savedReference.data;
    assert(finalSketch !== finalDrawing && savedReference.sketchDocument.textBoxes.length === 1, 'Saving combines text into the PNG and retains editable text in the draft');
    $('[data-edit-reference]').click();
    $('#sketchClose').click(); $('[data-edit-reference]').click();
    assert(snapshot() === finalDrawing && $('.sketch-text-input').value.includes('Second line'), 'Closing and reopening retains drawing and editable text');
    $('#zoomFit').click(); frame.style.width = '390px'; await tick();
    assert(doc.documentElement.scrollWidth <= 390, 'Mobile layout has no horizontal page overflow');
    assert(canvas.getBoundingClientRect().width < 390 && snapshot() === finalDrawing, 'Mobile resize preserves the drawing');
    $('[data-tool="text"]').click(); $('.sketch-text-input').focus();
    assert($('.sketch-text-move').getBoundingClientRect().height >= 26, 'Text move handle remains usable at mobile scale');
    const actions = $('.sketch-actions').getBoundingClientRect();
    assert(actions.right <= 390, 'Save and download actions fit on mobile');
    let download, exported;
    win.URL.createObjectURL = blob => { exported = blob; return 'blob:sketch-test'; };
    win.URL.revokeObjectURL = () => {};
    win.HTMLAnchorElement.prototype.click = function() { download = this.download; };
    $('#downloadSketch').click();
    for (let i = 0; i < 30 && !exported; i++) await tick();
    assert(exported && exported.type === 'image/png' && download.endsWith('-sketch.png'), 'Download generates a PNG with a sketch filename');
    const exportedUrl = await new Promise(resolve => { const reader = new win.FileReader(); reader.onload = () => resolve(reader.result); reader.readAsDataURL(exported); });
    const bitmap = new win.Image();
    await new Promise((resolve, reject) => { bitmap.onload = resolve; bitmap.onerror = reject; bitmap.src = exportedUrl; });
    assert(bitmap.width === 1200 && bitmap.height === 720, 'PNG exports full resolution regardless of zoom or mobile width');
    assert(exportedUrl === finalSketch, 'Download contains the full sketch without the alignment grid');
    $('#saveSketch').click();
    await tick();
    const draft = await win.clientDraftStore.load('capstone-client-brief-v1:sketchpad-regression-test');
    assert(draft.references.length === 1 && draft.references[0].data === finalSketch, 'Editing a sketch updates its attachment without duplicating it');
    assert($('[data-edit-reference]').textContent === 'Edit sketch', 'Reference gallery offers Edit sketch');
    const pngBytes = Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jA3sAAAAASUVORK5CYII='), c => c.charCodeAt(0));
    const files = new win.DataTransfer();
    files.items.add(new win.File([pngBytes], 'Moodboard.png', {type:'image/png'}));
    files.items.add(new win.File([pngBytes], 'Palette.png', {type:'image/png'}));
    files.items.add(new win.File(['invalid'], 'Notes.txt', {type:'text/plain'}));
    assert($('#file').multiple, 'File picker permits multiple selections');
    $('#file').files = files.files; $('#file').dispatchEvent(new win.Event('change'));
    for (let i = 0; i < 100 && $('#upload').disabled; i++) await tick();
    assert(doc.querySelectorAll('.reference-item').length === 3, 'Batch upload adds both valid images and preserves the sketch');
    const afterUpload = await win.clientDraftStore.load('capstone-client-brief-v1:sketchpad-regression-test');
    assert(afterUpload.references.length === 3 && afterUpload.references[0].sketchDocument.textBoxes.length === 1, 'IndexedDB saves the full gallery and editable sketch');
    doc.querySelectorAll('[data-remove-reference]')[1].click(); await tick();
    assert(doc.querySelectorAll('.reference-item').length === 2 && $('.reference-item img').src === finalSketch, 'Individual removal preserves other references');
    $('#draw').click();
    assert(snapshot() === blank, 'Add sketch opens a fresh canvas alongside existing references');
    $('#saveSketch').click(); await tick();
    assert(doc.querySelectorAll('.reference-item').length === 3 && $('.reference-item img').src === finalSketch, 'Another sketch is added without replacing the first');
    doc.querySelectorAll('[data-remove-reference]')[2].click(); await tick();
    $('#nextButton').click();
    assert(doc.querySelectorAll('.reference-item').length === 2 && $('.reference-item img').src === finalSketch, 'Review displays all remaining references');
    await tick();
    const reload = document.createElement('iframe'); reload.srcdoc = frame.srcdoc; document.body.append(reload);
    for (let i = 0; i < 100 && !reload.contentDocument.querySelector('.reference-item'); i++) await tick();
    assert(reload.contentDocument.querySelectorAll('.reference-item').length === 2, 'Reloading the builder restores the entire reference collection'); reload.remove();
    const legacyId = 'sketchpad-legacy-test';
    win.localStorage.setItem('capstone-client-brief-v1:' + legacyId, JSON.stringify({flowVersion:2, step:3, reference:finalSketch, referenceName:'Legacy image.png', sketch:finalSketch, sketchDocument:savedReference.sketchDocument}));
    const migrated = document.createElement('iframe'); migrated.srcdoc = frame.srcdoc.replace('sketchpad-regression-test', legacyId); document.body.append(migrated);
    for (let i = 0; i < 100 && !migrated.contentDocument.querySelector('.reference-item'); i++) await tick();
    assert(migrated.contentDocument.querySelectorAll('.reference-item').length === 2 && migrated.contentDocument.querySelector('[data-edit-reference]'), 'Legacy image and sketch drafts migrate into editable collection entries');
    migrated.contentDocument.querySelector('#nextButton').click(); await tick();
    assert((await win.clientDraftStore.load('capstone-client-brief-v1:' + legacyId)).references.length === 2 && !win.localStorage.getItem('capstone-client-brief-v1:' + legacyId), 'Legacy draft is removed only after the IndexedDB migration saves'); migrated.remove();
    // A new editor must decode persisted PNGs, as it does after a page reload.
    const originalDialog = doc.querySelector('.sketch-dialog');
    originalDialog.remove();
    const editor = win.createClientSketchpad({getName:() => 'Test', onSave:() => {}});
    editor.open({sketch:finalSketch});
    for (let i = 0; i < 30 && $('#saveSketch').disabled; i++) await tick();
    assert($('#sketchCanvas').toDataURL() === finalSketch, 'Persisted sketch reopens without distortion or pixel loss');
    const moveReopened = (x1, y1, x2, y2) => {
      const target = $('#sketchCanvas'); target.setPointerCapture = () => {}; target.hasPointerCapture = () => false;
      $('[data-tool="move"]').click();
      const rect = target.getBoundingClientRect();
      for (const [type, x, y] of [['pointerdown', x1, y1], ['pointermove', x2, y2], ['pointerup', x2, y2]]) {
        target.dispatchEvent(new win.PointerEvent(type, {bubbles:true, pointerId:3, button:0, clientX:rect.left + x * rect.width / 1200, clientY:rect.top + y * rect.height / 720}));
      }
    };
    moveReopened(200, 100, 200, 150);
    assert($('#sketchCanvas').toDataURL() !== finalSketch && !$('.sketch-selection').hidden, 'Older flattened sketches can move as a single image layer');
    $('#sketchUndo').click();
    assert($('#sketchCanvas').toDataURL() === finalSketch, 'Undo restores the legacy image layer without pixel loss');
    $('.sketch-dialog').close();
    editor.open({sketch:savedReference.data, sketchDocument:savedReference.sketchDocument});
    for (let i = 0; i < 30 && $('#saveSketch').disabled; i++) await tick();
    assert($('#sketchCanvas').toDataURL() === finalDrawing && $('.sketch-text-input').value.includes('Second line'), 'Reloaded draft restores separate artwork and editable text boxes');
    moveReopened(200, 100, 200, 150);
    const reloadedContext = $('#sketchCanvas').getContext('2d');
    assert(reloadedContext.getImageData(200, 100, 1, 1).data[0] === 255 && reloadedContext.getImageData(200, 150, 1, 1).data[0] === 29 && reloadedContext.getImageData(500, 180, 1, 1).data[0] === 49, 'Reloaded vector drafts keep strokes independently movable');
    $('#sketchUndo').click();
    assert($('#sketchCanvas').toDataURL() === finalDrawing, 'Undo works after reopening and moving a saved element');
    $('.sketch-dialog').close();
    editor.open({sketch:finalSketch, sketchDocument:{version:1, background:finalDrawing, textBoxes:savedReference.sketchDocument.textBoxes}});
    for (let i = 0; i < 30 && $('#saveSketch').disabled; i++) await tick();
    assert($('#sketchCanvas').toDataURL() === finalDrawing && $('.sketch-text-input').value.includes('Second line'), 'Version 1 drafts preserve their drawing and editable text');
    $('.sketch-dialog').close();
    doc.querySelector('.sketch-dialog').remove(); doc.body.append(originalDialog);
    $('[data-go="1"]').click();
    $('#projectName').value = 'Multiple references'; $('#projectName').dispatchEvent(new win.Event('input'));
    $('#idea').value = 'A project with images and sketches'; $('#idea').dispatchEvent(new win.Event('input'));
    $('[data-go="4"]').click();
    const requests = [];
    let failUpload = true;
    win.fetch = async (url, options) => {
      const body = JSON.parse(options.body); requests.push({url,body});
      if (url === 'upload-reference.php' && failUpload && requests.length === 2) return new win.Response(JSON.stringify({error:'Upload interrupted'}), {status:503});
      return new win.Response(JSON.stringify({ok:true, id:body.id || body.submissionId}), {status:200});
    };
    $('#nextButton').click();
    for (let i = 0; i < 100 && $('#nextButton')?.disabled; i++) await tick();
    assert(requests.length === 2 && requests.every(item => item.url === 'upload-reference.php') && $('#nextButton').textContent === 'Retry submission', 'Upload failure preserves the draft and prevents partial submission');
    failUpload = false; $('#nextButton').click();
    for (let i = 0; i < 100 && !$('#newBrief'); i++) await tick();
    const finalRequest = requests.at(-1);
    assert(finalRequest.url === 'submit-brief.php' && finalRequest.body.brief.references.length === 2 && !JSON.stringify(finalRequest.body).includes('data:image/'), 'Final submission includes all uploaded IDs instead of a combined image payload');
    assert(requests[0].body.id === requests[2].body.id && $('#newBrief'), 'Retry reuses reference IDs and completes the brief');
    $('#newBrief').click(); $('[data-go="3"]').click();
    assert(!$('#removeAllReferences'), 'Remove all is hidden when there are no references');
    const moreFiles = new win.DataTransfer();
    moreFiles.items.add(new win.File([pngBytes], 'First.png', {type:'image/png'}));
    moreFiles.items.add(new win.File([pngBytes], 'Second.png', {type:'image/png'}));
    $('#file').files = moreFiles.files; $('#file').dispatchEvent(new win.Event('change'));
    for (let i = 0; i < 100 && $('#upload').disabled; i++) await tick();
    $('#draw').click(); $('#saveSketch').click(); await tick();
    assert($('.reference-item') && doc.querySelectorAll('.reference-item').length === 3 && $('#removeAllReferences'), 'Remove all appears for a collection containing images and a sketch');
    let confirmations = 0;
    win.confirm = message => { confirmations++; assert(message.includes('3 references') && message.includes('sketches'), 'Bulk removal confirms the number and includes sketches'); return false; };
    $('#removeAllReferences').click();
    assert(doc.querySelectorAll('.reference-item').length === 3 && confirmations === 1, 'Cancelling Remove all keeps every reference');
    win.confirm = () => true;
    $('#removeAllReferences').click(); await tick();
    assert(!$('.reference-item') && !$('#removeAllReferences') && $('.reference-collection').textContent.includes('0 added'), 'Remove all clears the gallery and hides the bulk action');
    assert((await win.clientDraftStore.load('capstone-client-brief-v1:sketchpad-regression-test')).references.length === 0, 'Bulk removal persists to the draft');
    $('#draw').click();
    assert(snapshot() === blank, 'Opening a sketch after Remove all starts on a fresh canvas');
    $('#sketchClose').click();
    win.localStorage.removeItem('capstone-client-brief-v1:sketchpad-regression-test');
    await new Promise((resolve, reject) => {
      const request = win.indexedDB.open('capstone-client-drafts', 1);
      request.onsuccess = () => {
        const tx = request.result.transaction('drafts', 'readwrite');
        for (const id of ['sketchpad-regression-test', legacyId]) tx.objectStore('drafts').delete('capstone-client-brief-v1:' + id);
        tx.oncomplete = () => { request.result.close(); resolve(); }; tx.onerror = reject;
      }; request.onerror = reject;
    });
    results.textContent = `PASS: ${passed.length} checks\n` + passed.join('\n');
  } catch (error) { results.textContent = `FAIL after ${passed.length} checks: ${error.message}\n` + passed.join('\n'); }
};
</script>
